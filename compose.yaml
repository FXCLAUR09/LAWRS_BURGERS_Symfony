
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawrs_burgers_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command: php -S 0.0.0.0:8000 -t public

  database:
    image: mariadb:10.11
    container_name: lawrs_burgers_database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: lawrs_burgers
      MARIADB_USER: lawrs_user
      MARIADB_PASSWORD: lawrs_password
      MARIADB_ROOT_PASSWORD: lawrs_root_password
    ports:
      - "3307:3306"
    volumes:
      - lawrs_database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lawrs_burgers_phpmyadmin
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"

volumes:
  lawrs_database_data:
