security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        backoffice_users:
            id: App\Security\BackOfficeUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            stateless: false
            provider: backoffice_users
            custom_authenticators:
                - App\Security\SessionBackOfficeAuthenticator

    # Shared operational pages are intentionally accessible to both roles.
    # Admin-only pages are protected after these more specific rules.
    access_control:
        - { path: '^/admin/burgers(?:/|$)', roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: '^/admin/orders(?:/|$)', roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: '^/staff(?:/|$)', roles: ROLE_STAFF }
        - { path: '^/admin(?:/|$)', roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
